.rgrid i.self { background: var(--mint-500); border-color: var(--mint-400); }
.rgrid-all { font-size: calc(.16 * var(--t)); font-weight: 700; color: var(--amber); padding: .02rem .06rem; border: 1px solid var(--amber); background: rgba(246, 163, 41, .25); }
.dsec { display: flex; flex-direction: column; gap: .08rem; }
.dsec__title { display: flex; align-items: baseline; gap: .1rem; font-size: calc(.17 * var(--t)); font-weight: 700; color: var(--mint-400); padding-bottom: .04rem; border-bottom: 1px solid var(--line); }
.dtext { font-size: calc(.15 * var(--t)); line-height: 1.65; color: var(--text-md); }
.dskill { display: flex; gap: .12rem; align-items: center; }
.dskill__icon { width: .62rem; height: .62rem; flex: none; object-fit: cover; border: 1px solid var(--line-3); background: #0a0d0c; }
.dskill__icon--empty { display: grid; place-items: center; }
.dskill__icon--empty b { font-family: var(--font-display); font-size: calc(.2 * var(--t)); color: var(--mint-400); letter-spacing: .02em; }
.dskill__slot { display: inline-block; margin-right: .06rem; padding: 0 .05rem; vertical-align: .02rem; font-family: var(--font-display);
  font-size: calc(.12 * var(--t)); line-height: 1.5; color: var(--text-lo); border: 1px solid var(--line-3); }
.dskill__meta { display: flex; flex-direction: column; gap: .05rem; min-width: 0; }
.dskill__name { font-size: calc(.19 * var(--t)); }
.dskill__tags { display: flex; flex-wrap: wrap; gap: .06rem; align-items: center; }
.dsp { font-size: calc(.12 * var(--t)); padding: 0 .06rem; line-height: 1.6; font-weight: 700; }
.dsp--time { background: #7fd37a; color: #0b1a0a; }
.dsp--atk { background: #ff8a3d; color: #1f0c00; }
.dsp--def { background: #f2bd3e; color: #1f1400; }
.dsp--trig { border: 1px solid var(--line-3); color: var(--text-lo); font-weight: 500; }
.dsp__num { display: inline-flex; align-items: center; gap: .03rem; font-size: calc(.13 * var(--t)); color: var(--text-lo); }
.dsp__num b { color: #fff; }
.dsp__num .icon { width: .14rem; height: .14rem; color: var(--gold); }
.dtalent { display: flex; flex-direction: column; gap: .02rem; }
.dtalent b { font-size: calc(.15 * var(--t)); color: var(--text-hi); }
/* the operator's own effect (特质, user playtest #3 item 8): compact, right under the header, gold accent */
.dgarrison {
  display: flex; flex-direction: column; gap: .04rem; padding: .07rem .1rem .08rem; flex: none;
  background: linear-gradient(90deg, rgba(242, 189, 62, .1), rgba(242, 189, 62, .02) 70%); border-left: 3px solid var(--gold-2);
}
.dgarrison__head { display: flex; align-items: center; gap: .08rem; }
.dgarrison__k { font-size: calc(.14 * var(--t)); font-weight: 900; letter-spacing: .12em; color: var(--gold-2); }
.dgarrison__type { display: inline-flex; align-items: center; gap: .04rem; font-size: calc(.12 * var(--t)); line-height: 1.5; color: var(--gold-2); padding: 0 .07rem 0 .03rem; border: 1px solid rgba(242, 189, 62, .4); }
.dgarrison__icon { width: .18rem; height: .18rem; object-fit: contain; }
.dgarrison__text { font-size: calc(.15 * var(--t)); line-height: 1.55; color: var(--text-hi); }
.dbonds { display: flex; flex-wrap: wrap; gap: .08rem; }
.dbond { display: inline-flex; align-items: center; gap: .05rem; padding: .03rem .1rem .03rem .05rem; font-size: calc(.15 * var(--t)); background: rgba(78, 216, 175, .08); border: 1px solid var(--mint-800); color: var(--mint-400); }
/* the unit's bonds in the header's right column, right under name / class (user playtest #2 item 9): icon, name,
   count / next threshold, tier pips — visible as soon as the card opens */
.dbonds--top { gap: .05rem; margin-top: .06rem; }
.dhead__info .dbonds--top .dbond { font-size: calc(.14 * var(--t)); padding: .02rem .07rem .02rem .03rem; }
.dhead__info .dbond__icon { width: .24rem; height: .24rem; }
.dbonds--top .dbond { gap: .06rem; padding: .03rem .08rem .03rem .04rem; font: inherit; font-size: calc(.15 * var(--t)); color: var(--text-md);
  background: rgba(255, 255, 255, .03); border: 1px solid var(--line-2); cursor: default; }
.dbonds--top button.dbond { cursor: pointer; }
.dbonds--top button.dbond:hover { border-color: var(--mint-500); color: #fff; }
.dbonds--top .dbond.is-active { color: var(--mint-400); background: rgba(78, 216, 175, .1); border-color: var(--mint-700); }
.dbonds--top .dbond.is-core .dbond__name { font-weight: 700; }
.dbond__icon { width: .26rem; height: .26rem; }
.dbond:not(.is-active) .dbond__icon img { filter: brightness(0) invert(.6); }
.dbond__count { font-size: calc(.15 * var(--t)); color: #fff; }
.dbond__count small { font-size: calc(.11 * var(--t)); color: var(--text-dim); }
.dbond__count.is-max { color: var(--gold-2); }
.dbond__tiers { display: inline-flex; gap: 2px; margin-left: .02rem; }
.dbond__tiers i { width: .05rem; height: .12rem; background: rgba(255, 255, 255, .16); transform: skewX(-18deg); }
.dbond__tiers i.on { background: var(--mint-400); box-shadow: 0 0 .04rem rgba(78, 216, 175, .8); }
/* a bond the mode never activates (标准: 10 of 23 — gameLogic modeOffBonds) */
.dbonds--top .dbond.is-off { border-style: dashed; border-color: rgba(255, 255, 255, .16); background: transparent; color: var(--text-dim); }
.dbond.is-off .dbond__name { text-decoration: line-through; text-decoration-color: rgba(255, 84, 84, .6); }
.dbond.is-off .dbond__icon img { filter: grayscale(1) brightness(.5); }
.dbond__off { font-size: calc(.12 * var(--t)); color: var(--text-dim); white-space: nowrap; }
.dtag-loadout { display: inline-block; margin-left: .08rem; vertical-align: .02rem; font-size: calc(.11 * var(--t)); font-weight: 700; letter-spacing: .06em;
  padding: 0 .06rem; line-height: 1.6; background: var(--mint-500); color: #062019; }
.dmodule { display: flex; align-items: center; flex-wrap: wrap; gap: .08rem; font-size: calc(.15 * var(--t)); }
.dmodule__name { color: var(--text-hi); }
/* official module type icon (local-client art, white glyph) on a dark tile; the type letter without it */
.dmodule__icon { flex: none; display: inline-grid; place-items: center; width: .4rem; height: .4rem; background: linear-gradient(180deg, #2a322f, #151a18); border: 1px solid var(--gold-2); border: 1px solid color-mix(in srgb, var(--gold-2) 60%, transparent); }
.dmodule__icon img { width: 80%; height: 80%; object-fit: contain; }
.dmodule__icon b { font-size: calc(.2 * var(--t)); font-weight: 700; line-height: 1; color: var(--gold-2); }
.dmodule__type { font-family: var(--font-display); font-size: calc(.12 * var(--t)); letter-spacing: .1em; padding: 0 .06rem; border: 1px solid var(--line-3); color: var(--text-lo); }
.dmodule.is-none .dmodule__name { color: var(--text-dim); font-weight: 500; }
.ditem { display: flex; gap: .1rem; align-items: flex-start; }
.ditem__text { display: flex; flex-direction: column; gap: .02rem; min-width: 0; }
.ditem__text b { font-size: calc(.15 * var(--t)); }
.ditem__desc { font-size: calc(.13 * var(--t)); line-height: 1.55; color: var(--text-lo); }
.dempty { font-size: calc(.14 * var(--t)); }
.dhint { display: flex; align-items: flex-start; gap: .06rem; font-size: calc(.14 * var(--t)); color: var(--text-lo); line-height: 1.6; }
.dhint .icon { width: .16rem; height: .16rem; margin-top: .03rem; flex: none; }
/* a merge-completing shop / reward card's 可晋升 destination (the tag's colour; touch shows no title — QA 6b) */
.dhint--merge { color: var(--gold); }
/* a rule the official item text leaves out (items.json `note`: 突变细胞 returns to the hand after each use) */
.dhint--rule { color: var(--text-md); }
/* 变形同构体's 天赋栏 (detailPanel MorphPairings, DESIGN §21.26): one line per bond — 【bond】 | the items that pair with it;
   本局禁用 struck through, the pairing a wearer wears highlighted. Px floors keep it readable on phones (1rem = 40 px). */
.dmorph { display: flex; flex-direction: column; gap: .05rem; font-size: max(calc(.14 * var(--t)), 9px); line-height: 1.5; color: var(--text-md); }
.dmorph__lead { margin: 0; color: var(--text-hi); }
.dmorph__list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 1px; }
.dmorph__row { display: grid; grid-template-columns: 6.2em minmax(0, 1fr); gap: .06rem; align-items: baseline; padding: .02rem .06rem;
  background: rgba(255, 255, 255, .025); border-left: 2px solid transparent; }
.dmorph__bond { font-weight: 700; color: var(--mint-400); white-space: nowrap; }
.dmorph__items { min-width: 0; overflow-wrap: anywhere; }
.dmorph__row.is-off .dmorph__bond { color: var(--text-dim); text-decoration: line-through; text-decoration-color: rgba(255, 84, 84, .6); }
.dmorph__row.is-off .dmorph__items { color: var(--text-dim); }
.dmorph__row.is-worn { background: rgba(78, 216, 175, .14); border-left-color: var(--mint-400); }
.dmorph__item.is-worn { color: #fff; font-weight: 700; }
.dmorph__tag { display: inline-block; margin-left: .06rem; padding: 0 .05rem; font-size: max(calc(.11 * var(--t)), 8px); line-height: 1.5; font-weight: 700; white-space: nowrap; }
.dmorph__tag.is-on { background: var(--mint-500); color: #062019; }
.dmorph__tag.is-off { border: 1px dashed rgba(255, 255, 255, .25); color: var(--text-dim); font-weight: 500; }
.dmorph__none { margin: 0; color: var(--gold-2); }
/* a bond item's line: what it gives a 变形同构体 wearer (MorphGrantLine) */
.dhint--morph { font-size: max(calc(.14 * var(--t)), 9px); color: var(--text-md); }
.dhint--morph.is-worn { color: var(--mint-400); }
.dhint--morph.is-off { color: var(--text-dim); }
.dactions { display: flex; justify-content: flex-end; gap: .1rem; padding-top: .06rem; border-top: 1px solid var(--line); }
.dsell { margin-left: .06rem; color: #1d1400; }
.dfactions { display: flex; flex-wrap: wrap; gap: .06rem; }
.dfaction { display: inline-flex; align-items: center; gap: .04rem; font-size: calc(.13 * var(--t)); color: var(--amber); padding: 0 .08rem 0 .02rem; border: 1px solid rgba(246, 163, 41, .45); }
.dfaction img { width: .22rem; height: .22rem; object-fit: contain; }
.dabil { margin: 0; padding-left: .2rem; display: flex; flex-direction: column; gap: .05rem; font-size: calc(.15 * var(--t)); line-height: 1.6; color: var(--text-md); }
.dabil li.is-off { color: var(--text-dim); }
.dabil li.is-off .rt-term { color: var(--text-dim); border-bottom-color: transparent; }

/* ---- bond popup ---- */
.bpop {
  position: absolute; left: 2.3rem; top: 2.1rem; width: 5.4rem; max-height: calc(100% - 2.4rem); z-index: 8; overflow: auto;
  display: flex; flex-direction: column; gap: .12rem; padding: .2rem .22rem;
  background: rgba(11, 15, 13, .97); border: 1px solid var(--line-2); box-shadow: 0 .14rem .4rem rgba(0, 0, 0, .65);
  animation: pop-in var(--t-med) var(--ease-out);
}
/* placement (gameLogic bondPopupPlace / BPOP — keep in sync): beside the left-docked detail card, left of the
   right-docked one, against the right edge, or over the card it was opened from — never over the selected unit's
   underframe when a place is free */
.bpop--beside { left: 7.32rem; z-index: 10; }
.bpop--besideR { left: auto; right: 5.92rem; z-index: 10; }
.bpop--right { left: auto; right: .9rem; z-index: 10; }
.bpop.is-over { z-index: 10; background: rgb(11, 15, 13); }
.bpop__close { position: absolute; right: .08rem; top: .08rem; width: .36rem; height: .36rem; display: grid; place-items: center; background: none; border: 1px solid var(--line-2); color: var(--text-lo); }
.bpop__close .icon { width: .18rem; height: .18rem; }
.bpop__head { display: flex; gap: .16rem; align-items: center; }
.bpop__disc { width: .86rem; height: .86rem; border-radius: 50%; display: grid; place-items: center; background: #1b2320; border: 3px solid rgba(255, 255, 255, .14); flex: none; }
.bpop__disc .bglyph { width: .56rem; height: .56rem; }
.bpop__disc .bglyph img { filter: brightness(0) invert(.8); }
.bpop__disc.is-active { background: var(--mint-500); border-color: var(--mint-400); box-shadow: 0 0 .24rem rgba(23, 249, 183, .45); }
.bpop__disc.is-active .bglyph img { filter: brightness(0) opacity(.85); }
.bpop__titles { display: flex; flex-direction: column; gap: .02rem; min-width: 0; }
.bpop__name { font-size: calc(.32 * var(--t)); font-weight: 900; letter-spacing: .08em; }
.bpop__owner { display: inline-flex; align-items: center; gap: .06rem; font-size: calc(.14 * var(--t)); color: var(--amber); }
.bpop__owner b { color: #fff; font-weight: 700; max-width: 2.4rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.bpop.is-other .bpop__disc { box-shadow: 0 0 0 1px rgba(246, 163, 41, .55); }
.bpop__facts { display: flex; gap: .16rem; font-size: calc(.15 * var(--t)); color: var(--text-lo); }
.bpop__facts b { color: #fff; font-size: calc(.18 * var(--t)); }
.bpop__facts small { font-size: calc(.12 * var(--t)); }
.bpop__off { margin: .08rem 0 0; font-size: calc(.14 * var(--t)); color: var(--text-lo); border-left: 2px solid rgba(255, 255, 255, .2); padding-left: .08rem; }
.bpop__tiers { display: flex; gap: .06rem; }
.bpop__tier { display: flex; align-items: baseline; gap: .02rem; padding: .02rem .12rem; border: 1px solid var(--line-2); color: var(--text-dim); font-size: calc(.13 * var(--t)); }
.bpop__tier b { font-size: calc(.2 * var(--t)); }
.bpop__tier.is-on { background: var(--mint-500); color: var(--text-on-mint); border-color: var(--mint-400); }
.bpop__sec { display: flex; flex-direction: column; gap: .06rem; }
.bpop__sec h4 { font-size: calc(.16 * var(--t)); color: var(--mint-400); display: flex; align-items: baseline; gap: .08rem; }
.bpop__sec h4 small { font-size: calc(.13 * var(--t)); color: var(--text-lo); font-weight: 400; }
.bpop__sec--now { padding: .1rem .12rem; background: rgba(78, 216, 175, .06); border-left: 3px solid var(--mint-500); }
.bpop__desc { font-size: calc(.15 * var(--t)); line-height: 1.7; color: var(--text-md); }
.bpop__members { display: grid; grid-template-columns: repeat(5, 1fr); gap: .08rem; }
.bpop__member { position: relative; display: flex; flex-direction: column; align-items: center; gap: .03rem; padding: .04rem 0; background: none; border: 1px solid transparent; }
.bpop__member:hover { border-color: var(--line-2); background: rgba(255, 255, 255, .03); }
.bpop__member.is-on .uthumb__art { border-color: var(--mint-400); box-shadow: 0 0 .1rem rgba(23, 249, 183, .45); }
.bpop__mname { font-size: calc(.12 * var(--t)); color: var(--text-lo); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bpop__member.is-on .bpop__mname { color: var(--mint-400); }
.bpop__member.is-owned .bpop__mname { color: var(--text-hi); }
.bpop__ban { position: absolute; top: .02rem; right: .1rem; width: .2rem; height: .2rem; display: grid; place-items: center; background: var(--red); color: #fff; border-radius: 50%; }
.bpop__ban .icon { width: .14rem; height: .14rem; }
/* a member through 变形同构体 (the item pairing, not the operator's own bond): a gold 同构 tag on the portrait */
.bpop__iso { position: absolute; top: .02rem; right: .08rem; padding: 0 .04rem; font-size: calc(.11 * var(--t)); line-height: 1.45; font-weight: 700; color: #141414; background: var(--gold-2); }
/* a 自选 pick all of whose bonds are off this match (m.private.diyBanned): its 「自选」 tag moves down to the portrait's
   bottom corner (the 替补 mark's place), clear of the red ✕ and the tier chip */
.bpop__member.is-banned .bpop__diy { top: .42rem; }
.dbonds--top .dbond.is-granted { border-style: dashed; }
.dbond__iso { font-size: calc(.11 * var(--t)); font-weight: 700; color: var(--gold-2); }
/* a count that holds 调和's +1 (the server's bond entry `harmony`, DESIGN §21.26): 在场 n（含调和 +1） and the 调和 row that
   heads the member list, naming the 调和 operators on the board (px floors: readable on phones) */
.bpop__facts small.bpop__hnote { font-size: max(calc(.12 * var(--t)), 8px); color: var(--gold-2); }
.bpop__harmony { display: flex; align-items: center; gap: .08rem; width: 100%; margin: 0; padding: .05rem .1rem; text-align: left;
  font: inherit; font-size: max(calc(.14 * var(--t)), 9px); line-height: 1.45; color: var(--text-md); background: rgba(242, 189, 62, .08); border: 1px dashed rgba(242, 189, 62, .5); }
button.bpop__harmony { cursor: pointer; }
button.bpop__harmony:hover { border-style: solid; color: #fff; }
.bpop__harmony b { flex: none; color: var(--gold-2); font-weight: 700; white-space: nowrap; }
.bpop__harmony span { min-width: 0; }
.bpop__harmony .bglyph { width: max(.24rem, 14px); height: max(.24rem, 14px); }
.bpop__harmony .bglyph img { filter: brightness(0) invert(.78) sepia(1) saturate(3) hue-rotate(5deg); }

/* ---- enemy / info drawer ---- */
.edrawer {
  --bk-c: var(--amber);
  position: absolute; left: 50%; top: 1.08rem; transform: translateX(-50%); width: 7.4rem; max-height: calc(100% - 4.4rem); z-index: 9;
  display: flex; flex-direction: column; background: rgba(11, 15, 13, .97); border: 1px solid var(--line-2); box-shadow: 0 .14rem .4rem rgba(0, 0, 0, .65);
  animation: drawer-in var(--t-slow) var(--ease-out);
}
@keyframes drawer-in { from { opacity: 0; transform: translate(-50%, -.2rem); } }
.edrawer__top { display: flex; align-items: flex-end; justify-content: space-between; padding: .08rem .12rem 0 .16rem; border-bottom: 1px solid var(--line); }
.edrawer__top .tabs { border-bottom: 0; }
.edrawer__close { width: .34rem; height: .34rem; margin-bottom: .06rem; display: grid; place-items: center; background: none; border: 1px solid var(--line-2); color: var(--text-lo); }
.edrawer__close .icon { width: .18rem; height: .18rem; }
.edrawer__body { overflow: auto; padding: .14rem .18rem .18rem; display: flex; flex-direction: column; gap: .12rem; }
.edrawer__sum { display: flex; align-items: center; justify-content: space-between; gap: .12rem; flex-wrap: wrap; font-size: calc(.15 * var(--t)); color: var(--text-md); }
.edrawer__sum b { font-size: calc(.19 * var(--t)); }
.edrawer__empty { display: flex; align-items: center; gap: .08rem; justify-content: center; padding: .3rem; color: var(--text-dim); font-size: calc(.16 * var(--t)); }
.edrawer__empty .icon { width: .24rem; height: .24rem; }
.fchips { display: flex; gap: .06rem; flex-wrap: wrap; }
.fchip { display: inline-flex; align-items: center; gap: .04rem; padding: 0 .1rem 0 .02rem; font-size: calc(.13 * var(--t)); color: var(--amber); border: 1px solid rgba(246, 163, 41, .45); background: rgba(246, 163, 41, .06); }
.fchip__icon { width: .26rem; height: .26rem; object-fit: contain; }
.elist { display: grid; grid-template-columns: 1fr 1fr; gap: .08rem; }
.erow { display: flex; align-items: center; gap: .1rem; padding: .06rem .12rem .06rem .06rem; background: rgba(255, 255, 255, .025); border: 1px solid var(--line); text-align: left; color: inherit; transition: border-color var(--t-fast), background var(--t-fast); }
.erow:hover { border-color: var(--line-3); background: rgba(255, 255, 255, .05); }
.erow--boss { border-color: rgba(255, 110, 40, .6); background: rgba(232, 90, 26, .1); }
.erow--bounty { border-color: rgba(255, 198, 0, .45); }
.erow__text { display: flex; flex-direction: column; gap: .03rem; min-width: 0; flex: 1; }
.erow__name { font-size: calc(.16 * var(--t)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.erow__tags { display: flex; gap: .04rem; flex-wrap: wrap; }
.erow__count { font-size: calc(.26 * var(--t)); color: #fff; }
.etag { font-size: calc(.11 * var(--t)); line-height: 1.5; padding: 0 .05rem; font-weight: 700; }
.etag--boss { background: var(--orange); color: #fff; }
.etag--bounty { background: var(--gold); color: #1d1400; }
.etag--escort { background: var(--bg-4); color: var(--text-md); }
.etag--elite { background: var(--gold-2); color: #1d1400; }
.etag--fly { background: #2c4a63; color: #cfe8ff; }
.etag--faction { border: 1px solid rgba(246, 163, 41, .5); color: var(--amber); font-weight: 500; }
.eboss { display: flex; gap: .12rem; align-items: center; padding: .1rem .12rem; border: 1px solid rgba(255, 110, 40, .45); background: linear-gradient(90deg, rgba(232, 90, 26, .14), transparent); }
.eboss > div { display: flex; flex-direction: column; gap: .02rem; }
.eboss b { font-size: calc(.19 * var(--t)); }
.eboss .t-lo { font-size: calc(.13 * var(--t)); }
.iband { display: flex; gap: .12rem; align-items: flex-start; padding: .1rem; background: rgba(78, 216, 175, .05); border: 1px solid var(--mint-800); }
.iband > div { display: flex; flex-direction: column; gap: .03rem; min-width: 0; }
.iband b { font-size: calc(.19 * var(--t)); }
.iband b small { font-size: calc(.14 * var(--t)); font-weight: 400; margin-left: .06rem; }
.iband__desc { font-size: calc(.14 * var(--t)); line-height: 1.6; color: var(--text-md); }
.istage { display: flex; align-items: center; gap: .06rem; font-size: calc(.15 * var(--t)); color: var(--text-lo); }
.istage .icon { width: .18rem; height: .18rem; color: var(--mint-500); }
.istage b { color: var(--text-hi); }
.ihead { font-size: calc(.16 * var(--t)); color: var(--mint-400); display: flex; gap: .08rem; align-items: baseline; }
.ihead small { color: var(--text-lo); font-size: calc(.14 * var(--t)); }
.ibonds { display: flex; flex-wrap: wrap; gap: .06rem; }
.ibond { display: inline-flex; align-items: center; gap: .05rem; padding: .03rem .08rem .03rem .04rem; font-size: calc(.14 * var(--t)); border: 1px solid var(--line-2); color: var(--text-md); }
.ibond.is-off { color: var(--text-dim); background: rgba(255, 255, 255, .02); text-decoration: line-through; text-decoration-color: rgba(255, 84, 84, .6); }
.ibond.is-off .bglyph img { filter: grayscale(1) brightness(.5); }
.ibond__ban { display: inline-flex; align-items: center; gap: .02rem; font-size: calc(.12 * var(--t)); padding: 0 .05rem; background: var(--red); color: #fff; text-decoration: none; }
.ibond__ban .icon { width: .12rem; height: .12rem; }
.ibanned { display: flex; flex-wrap: wrap; gap: .06rem; }
.ibanned__one { padding: 0; background: none; border: 0; }
/* 0.2.0: the player's own 自选 pieces out of the shop this match (ui/matchInfo.js DiyBannedLine) */
.idiybanned { margin: .08rem 0 0; font-size: calc(.13 * var(--t)); line-height: 1.5; }
.idiybanned .diybanned__tag { display: inline-block; margin-right: .05rem; padding: 0 .05rem; font-size: calc(.11 * var(--t)); font-weight: 700;
  background: var(--mint-500); color: var(--text-on-mint); }

/* ---- 机变 overlay ---- */
.spov { position: absolute; inset: 0 0 0 2.8rem; z-index: 20; }
.gm.has-sp .gm__bonds, .gm.has-sp .gm__effects { opacity: 0; pointer-events: none; transition: opacity var(--t-med); }
.spov__veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(4, 7, 6, .6) 0, rgba(4, 7, 6, .9) .5rem, rgba(4, 7, 6, .92)); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); border-left: 1px solid var(--line); }
.spov__inner { position: absolute; left: .3rem; right: .5rem; top: 1.14rem; bottom: .5rem; display: flex; flex-direction: column; gap: .16rem; animation: screen-in var(--t-slow) var(--ease-out); }
.spov__head { display: flex; align-items: flex-end; justify-content: space-between; gap: .3rem; }
.spov__titles { display: flex; flex-direction: column; gap: .04rem; }
.spov__title { display: flex; align-items: baseline; gap: .14rem; font-size: calc(.5 * var(--t)); font-weight: 900; letter-spacing: .08em; color: #eafff8; text-shadow: 0 0 .2rem rgba(23, 249, 183, .35); }
.spov__title.is-special { color: var(--gold-2); text-shadow: 0 0 .2rem rgba(242, 189, 62, .35); }
.spov__bar { color: var(--mint-700); font-weight: 400; }
.spov__desc { font-size: calc(.22 * var(--t)); font-weight: 400; color: var(--text-lo); letter-spacing: .04em; text-shadow: none; }
.spov__sub { font-size: calc(.15 * var(--t)); color: var(--text-dim); }
.spov__turn { display: flex; align-items: center; gap: .24rem; }
.spov__turntxt { display: flex; align-items: center; gap: .08rem; font-size: calc(.24 * var(--t)); font-weight: 700; color: var(--text-md); }
.spov__turntxt .icon { width: .26rem; height: .26rem; }
.spov__turntxt.is-mine { color: var(--gold); text-shadow: 0 0 .16rem rgba(255, 198, 0, .45); animation: blink 1.2s ease-in-out infinite; }
.spov__turntxt.is-done { color: var(--mint-400); }
.spov__order { display: flex; gap: .1rem; }
.spov__who { display: flex; align-items: center; gap: .08rem; padding: .05rem .12rem .05rem .06rem; background: rgba(255, 255, 255, .03); border: 1px solid var(--line); }
.spov__who.is-cur { border-color: var(--gold); background: rgba(255, 198, 0, .08); }
.spov__who.is-done { border-color: var(--mint-800); }
.spov__who.is-self .spov__wname { color: var(--mint-400); }
.spov__idx { font-size: calc(.16 * var(--t)); color: var(--text-dim); width: .2rem; text-align: center; }
.spov__wname { font-size: calc(.15 * var(--t)); max-width: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spov__wstate { display: grid; }
.spov__wstate .icon { width: .2rem; height: .2rem; }
.spov__who.is-done .spov__wstate { color: var(--mint-400); }
.spov__who.is-cur .spov__wstate { color: var(--gold); }
.spov__grid { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 1fr); gap: .2rem; }
.spov__grid--3 { grid-template-columns: repeat(3, minmax(0, 4.3rem)); grid-template-rows: minmax(0, 4.6rem); justify-content: center; align-content: start; gap: .36rem; margin-top: .3rem; }
.spov__grid--3 .spcard__icon { width: 1.3rem; height: 1.3rem; }
/* > 6 cards (a 多人 Mod raised config.coop.draftCards): the grid keeps its 3×2 and the draft is paged (ui/choiceOverlay.js
   SP_PER_PAGE), so a page never grows as implicit rows would (a 7th item would make the rows uneven). A slightly tighter
   gap pays for the pager row, which is outside the grid and would otherwise take the cards' height.
   ★ 0.2.1 状态：**配套的 JS 已经落位** —— `public/js/ui/choiceOverlay.js` 有 `SP_PER_PAGE = 6`（L42）、
     `spPages()`（L45-50）、分页条（L280-288），并且 L250 就是这条 class 的发出点：
     `cx('spov__grid', pages === 1 && shown.length <= 3 && 'spov__grid--3', pages > 1 && 'spov__grid--paged')`。
     本组选择器发出的 6 个类名（`spov__grid--paged` / `spov__pager` / `spov__pg` / `spov__pgcount` /
     `spov__pgdots` / `spov__pgdot` + `.is-cur`）与 JS **逐个对上**，无死规则。
     由 `test/ui/draft-paging.test.js`（19 条断言）守着「≤6 张不出现分页条、>6 张才分页」这条不变量。 */
.spov__grid--paged { grid-auto-rows: 0; gap: .15rem; }
.spov__pager { flex: none; display: flex; align-items: center; justify-content: center; gap: .16rem; }
.spov__pg { display: grid; place-items: center; width: .34rem; height: .34rem; padding: 0; cursor: pointer;
  background: rgba(255, 255, 255, .04); border: 1px solid var(--line-2); color: var(--text-md);
  transition: border-color var(--t-fast), background var(--t-fast), color var(--t-fast), opacity var(--t-fast); }
.spov__pg .icon { width: .2rem; height: .2rem; }
.spov__pg:hover:not(:disabled) { border-color: var(--mint-400); color: var(--mint-400); background: rgba(78, 216, 175, .14); }
.spov__pg:disabled { opacity: .3; cursor: default; }
.spov__pgcount { font-size: calc(.15 * var(--t)); letter-spacing: .06em; color: var(--text-lo); white-space: nowrap; }
.spov__pgdots { display: flex; align-items: center; gap: .12rem; padding-left: .04rem; }
/* the dots follow the host's own marker convention (a small rotated square, css/screens/room.css .solo-brief li::before) */
.spov__pgdot { width: .13rem; height: .13rem; padding: 0; cursor: pointer; transform: rotate(45deg);
  background: rgba(255, 255, 255, .16); border: 1px solid var(--line-2);
  transition: background var(--t-fast), border-color var(--t-fast); }
.spov__pgdot:hover { border-color: var(--mint-400); }
.spov__pgdot.is-cur { background: var(--mint-400); border-color: var(--mint-400); }
/* The official card (research 06 §11.5; the official 悬赏 / 机密商店 / 战术 screenshots): a framed icon at the top-left
   with the bold name beside it, the effect text under both across the card, left-aligned; the tier chip on the icon's
   corner, the taker's round avatar at the top-right (user playtest #6 item 6: the centred icon + name used to push the
   text out of a phone-sized card). --sp-px: the card's side padding; --tk / --tk-at: the taker avatar's size / inset. */
.spcard {
  --sp-px: .2rem; --tk: .5rem; --tk-at: .08rem;
  position: relative; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: .12rem; padding: .16rem var(--sp-px); overflow: hidden; text-align: left;
  background: linear-gradient(180deg, rgba(210, 224, 219, .12), rgba(120, 140, 132, .06)); border: 1px solid rgba(200, 220, 212, .25); color: var(--text-hi);
  transition: transform var(--t-fast) var(--ease-out), border-color var(--t-fast), background var(--t-fast), opacity var(--t-med);
}
.spcard__glow { position: absolute; inset: 0; background: radial-gradient(70% 50% at 50% 0%, rgba(78, 216, 175, .16), transparent 70%); pointer-events: none; }
.spcard.is-pickable { cursor: pointer; }
.spcard.is-pickable:hover { transform: translateY(-.06rem); border-color: var(--mint-400); background: linear-gradient(180deg, rgba(78, 216, 175, .18), rgba(78, 216, 175, .05)); box-shadow: 0 0 0 1px var(--mint-400), 0 .1rem .3rem rgba(23, 249, 183, .2); }
.spcard:disabled { cursor: default; }
.spcard.is-taken { background: rgba(120, 140, 132, .05); }
.spcard.is-taken > :not(.spcard__taker) { opacity: .38; filter: grayscale(.7); }
.spcard.is-mine { border-color: var(--mint-400); box-shadow: inset 0 0 0 1px var(--mint-400); }
.spcard.is-mine > :not(.spcard__taker) { opacity: 1; filter: none; }
.spcard__tier { position: absolute; left: .08rem; top: .08rem; z-index: 1; }
.spcard__head { flex: none; display: flex; align-items: center; gap: .18rem; min-width: 0; }
.spcard__icon { width: 1rem; height: 1rem; display: grid; place-items: center; flex: none; padding: .04rem;
  border: 2px solid rgba(214, 228, 222, .7); background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, .1), rgba(0, 0, 0, .32)); }
.spcard__icon img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 .06rem .12rem rgba(0, 0, 0, .6)); }
.spcard__icon .icon { width: 60%; height: 60%; color: var(--mint-500); }
.spcard--bounty .spcard__icon { padding: 0; border-color: rgba(255, 90, 74, .55); background: radial-gradient(circle, #3a1c18, #140d0c); }
.spcard--bounty .spcard__icon img { object-fit: cover; }
.spcard__title { display: flex; flex-direction: column; align-items: flex-start; gap: .06rem; min-width: 0; }
.spcard__name { font-size: .28rem; font-weight: 900; letter-spacing: .04em; line-height: 1.25; }
/* the effect text: the official rich text (highlighted numbers, set bonuses, line breaks), clamped by lines — 7 fit a 3×2
   card (the longest item, 信标, takes 7 at 16:9 and on phones narrower than ≈ 740 px); it never shrinks below them
   (flex: none) */
.spcard__desc { flex: none; font-size: .2rem; line-height: 1.4; color: var(--text-md); display: -webkit-box; -webkit-line-clamp: 7; -webkit-box-orient: vertical; overflow: hidden; }
.spov__grid--3 .spcard__desc { -webkit-line-clamp: 10; }
.spcard__tags { display: flex; flex-wrap: wrap; gap: .06rem; }
.spcard__tag { font-size: .13rem; font-weight: 700; padding: .01rem .08rem; }
.spcard__tag--team { background: var(--mint-500); color: var(--text-on-mint); }
.spcard__tag--coin { background: var(--gold); color: #1d1400; }
/* the taker's badge: the round avatar alone at the card's top-right corner, as in the official screenshots (the player's
   name is its tooltip and part of the card's accessible name); a taken card's head keeps clear of it, so a long name
   wraps before the badge instead of running under it (the avatar + name pill of v2.4.1 covered long names once the name
   moved into the top row) */
.spcard__taker { position: absolute; right: var(--tk-at); top: var(--tk-at); z-index: 1; display: block; border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(8, 11, 10, .9), 0 .04rem .12rem rgba(0, 0, 0, .6); }
.spcard__taker .pavatar { --pa: var(--tk); border-radius: 50%; overflow: hidden; border: 2px solid var(--mint-400); }
.spcard.is-taken .spcard__taker { filter: none; }
.spcard.is-taken .spcard__head { padding-right: calc(var(--tk) + var(--tk-at) - var(--sp-px) + .08rem); }
/* the card being picked (g.choice in flight): mint frame + a 选择中 strip with the sweeping busy bar of the buttons
   (components.css btn-busy) — no spinner over the card's text (user playtest #3 item 9) */
.spcard.is-busy { border-color: var(--mint-400); box-shadow: inset 0 0 0 1px var(--mint-400); }
.spcard__busy {
  position: absolute; left: 0; right: 0; bottom: 0; padding: .05rem 0 .08rem; overflow: hidden; pointer-events: none;
  font-size: .14rem; font-weight: 700; letter-spacing: .2em; color: var(--mint-400); background: rgba(8, 11, 10, .85);
}
.spcard__busy::after { content: ''; position: absolute; left: 0; bottom: 0; width: 40%; height: 2px; background: var(--mint-400); animation: btn-busy 1.1s var(--ease-in-out) infinite; }
/* two-tap pick (user playtest #4 item 2 — the shop's confirm language, game-shop.css .scard.is-armed): the selected card
   lifts with a gold frame and a 确认选择 · 再次点击 strip; the others dim; the header shows 确认选择 */
.spcard.is-armed, .spcard.is-armed:hover {
  z-index: 2; transform: translateY(-.1rem) scale(1.03); border-color: var(--gold);
  background: linear-gradient(180deg, rgba(255, 198, 0, .16), rgba(255, 198, 0, .04));
  box-shadow: 0 0 0 2px var(--gold), 0 .14rem .32rem rgba(0, 0, 0, .6), 0 0 .3rem rgba(255, 198, 0, .35);
}
.spov.has-armed .spcard.is-pickable:not(.is-armed) { filter: brightness(.7); }
.spov.has-armed .spcard.is-pickable:not(.is-armed):hover { filter: none; }
.spcard__confirm {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: flex; align-items: baseline; justify-content: center; gap: .1rem;
  padding: .04rem 0 .05rem; background: linear-gradient(0deg, var(--gold), #e0a800); color: #1d1400; pointer-events: none;
  animation: confirm-in var(--t-fast) var(--ease-out);
}
.spcard__confirm b { font-size: .18rem; font-weight: 900; letter-spacing: .22em; padding-left: .22em; }
.spcard__confirm small { font-size: .12rem; letter-spacing: .1em; opacity: .75; }
.spov__confirm { animation: pulse-gold 1.2s var(--ease-in-out) infinite; }
/* Short landscape phones (height < 10.8rem: the root size is clamped at 40 px, theme.css, so the page is only ≈ 9rem
   tall): a tighter header (no CONTINGENCY micro line, smaller margins) gives the grid ≈ .65rem more, and a smaller icon
   and tighter spacing leave a 3×2 card room for 7 lines of text (≈ 4 – 5.4 × 2.9rem: 162 × 116 px at 640×360, the
   smallest supported phone; 201 × 119 at 756×366, the user's Android) — every shop item, bounty and tactic text fits in
   full, taken or not (test/ui/playtest6-ui.e2e.test.js). */
@media (max-height: 431.98px) {
  .spov__inner { top: .84rem; bottom: .22rem; gap: .1rem; }
  .spov__titles > .micro { display: none; }
  .spov__grid { gap: .12rem; }
  .spcard { --sp-px: .12rem; --tk: .4rem; --tk-at: .04rem; gap: .06rem; padding: .08rem var(--sp-px); }
  .spcard__tier { left: .03rem; top: .03rem; }
  .spcard__head { gap: .12rem; }
  .spcard__icon { width: .72rem; height: .72rem; padding: .02rem; }
  .spov__grid--3 .spcard__icon { width: 1rem; height: 1rem; }
  .spcard__name { font-size: .23rem; }
  .spcard__desc { font-size: .19rem; }
  .spov__grid--3 .spcard__desc { -webkit-line-clamp: 10; }
  .spov__pager { gap: .12rem; }
  .spov__pg { width: .28rem; height: .28rem; }
  .spov__pg .icon { width: .17rem; height: .17rem; }
  .spov__pgcount { font-size: calc(.13 * var(--t)); }
  .spov__pgdot { width: .11rem; height: .11rem; }
}
/* The narrowest of them (640×360): with Noto Sans SC — the page's web font and Android's CJK font — the longest text
   (海沟实验体) wraps to 8 lines in a 162 px card, one more than the clamp; a slightly tighter line height gives the 8th
   line room (QA, playtest #6). */
@media (max-height: 431.98px) and (max-width: 699.98px) {
  .spcard__desc { line-height: 1.3; -webkit-line-clamp: 8; }
}

/* Grid image boxes: definite 100% tracks so `height: 100%` images resolve against the box (an auto track would
   let non-square art overflow its frame). */
.uthumb__art, .bandicon, .dhead__icon, .spcard__icon, .effect, .pavatar__img, .brief-faction__icon, .scard__itemart, .bglyph {
  grid-template-rows: 100%;
  grid-template-columns: 100%;
}
.spcard__icon img, .dhead__icon img, .scard__itemart img, .effect img { max-width: 100%; max-height: 100%; }

/* ---- direction wheel (ui/facingWheel.js, research 09 §1.2): white diamond, 4 chevrons, "✕ 点击取消", orange range ---- */
.fwheel { position: fixed; inset: 0; z-index: 6; touch-action: none; user-select: none; -webkit-user-select: none; cursor: crosshair; }
/* the wheel takes the keyboard focus when it opens (Enter confirms there, GitHub #394): no ring around the whole screen */
.fwheel:focus-visible { outline: none; }
.fwheel__stripes { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.fwheel__dia { position: absolute; transform: translate(-50%, -50%); pointer-events: none; animation: fwheel-in 160ms var(--ease-out); }
@keyframes fwheel-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.82); } }
.fwheel__svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 0 .05rem rgba(0, 0, 0, .75)); }
.fwheel__outer { fill: rgba(8, 12, 10, .1); stroke: #fff; stroke-width: 2.4px; vector-effect: non-scaling-stroke; }
.fwheel__quad { fill: transparent; transition: fill var(--t-fast); }
/* only the chevron lights (research 09 §1.2): a tinted quadrant would wash out the units standing under the diamond */
.fwheel__quad.is-on { fill: transparent; }
.fwheel__inner { fill: rgba(255, 255, 255, .06); stroke: rgba(255, 255, 255, .9); stroke-width: 1.6px; vector-effect: non-scaling-stroke; }
.fwheel.is-pressed .fwheel__inner { fill: rgba(255, 255, 255, .1); }
.fwheel__chev path { fill: rgba(255, 255, 255, .92); transform-box: fill-box; transform-origin: center; transition: transform var(--t-fast), fill var(--t-fast); }
.fwheel__chev.is-on path { fill: #ffae3d; transform: scale(1.4); filter: drop-shadow(0 0 3px rgba(255, 156, 51, .9)); }
.fwheel__cancel {
  position: absolute; left: 25%; top: 25%; transform: translate(-92%, -118%); pointer-events: auto;
  display: inline-flex; align-items: center; gap: .05rem; padding: .03rem .1rem .03rem .05rem; white-space: nowrap;
  background: var(--red); border: 0; color: #fff; font-size: .15rem; font-weight: 700; letter-spacing: .06em; cursor: pointer;
  clip-path: polygon(0 0, 100% 0, 100% 70%, calc(100% - .08rem) 100%, 0 100%); box-shadow: 0 .03rem .1rem rgba(0, 0, 0, .5);
}
.fwheel__cancel:hover { background: #ff4a2b; }
.fwheel__x { width: .18rem; height: .18rem; filter: brightness(0) invert(1); }
.fwheel__x--txt { display: grid; place-items: center; filter: none; font-size: .14rem; }
.fwheel__tip {
  position: absolute; left: 50%; top: 100%; transform: translate(-50%, .08rem); white-space: nowrap; pointer-events: none;
  padding: .04rem .16rem; background: rgba(8, 11, 10, .9); border: 1px solid rgba(255, 156, 51, .6); color: #ffc27a; font-size: .15rem; letter-spacing: .08em;
}
.fwheel__sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---- the temp overflow row's notice (ui/underframe.js TempRowNotice, user playtest #3 item 3): a dashed red frame
   around 临时整备区 and a label at its end. Over the field, under every HUD panel (.gm__hud z 3), never takes the
   pointer (the pieces under it stay draggable). ---- */
.tempnote { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.tempnote * { pointer-events: none; }
.tempnote__frame { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.tempnote__frame polygon {
  fill: rgba(255, 60, 40, .1); stroke: #ff5a47; stroke-width: 2.2px; stroke-dasharray: 9 5; stroke-linejoin: round;
  vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 .05rem rgba(255, 60, 40, .7)); animation: tempnote-pulse 1.6s ease-in-out infinite;
}
@keyframes tempnote-pulse { 50% { opacity: .55; } }
.tempnote__label {
  position: absolute; transform: translate(-100%, -50%); display: flex; flex-direction: column; gap: .02rem; max-width: 2.9rem;
  padding: .06rem .12rem .07rem .1rem; background: rgba(40, 6, 6, .9); border: 1px solid rgba(255, 90, 71, .75); border-left: 3px solid #ff5a47;
  box-shadow: 0 .04rem .16rem rgba(0, 0, 0, .6); color: #ffdcd6; animation: tempnote-in var(--t-med) var(--ease-out);
}
@keyframes tempnote-in { from { opacity: 0; } }
.tempnote__label.is-right { transform: translate(0, -50%); border-left-width: 1px; border-right: 3px solid #ff5a47; }
.tempnote__title { display: flex; align-items: center; gap: .05rem; font-size: .15rem; font-weight: 700; color: #fff; white-space: nowrap; }
.tempnote__title .icon { width: .17rem; height: .17rem; color: #ff6a55; flex: none; }
.tempnote__title .num { color: #ff8a78; font-size: .17rem; }
.tempnote__rule { font-size: .12rem; line-height: 1.45; color: rgba(255, 220, 214, .88); }
@media (prefers-reduced-motion: reduce) { .tempnote__frame polygon, .tempnote__label { animation: none; } }
.sp-reduced-motion .tempnote__frame polygon, .sp-reduced-motion .tempnote__label { animation: none; }
/* 0.2.0 补位: 「替补：X」 under the player's own prep pieces of a chess they do not own (screens/game/standInTags.js) */
.sitags { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
.sitag { position: absolute; transform: translate(-50%, .02rem); pointer-events: none; white-space: nowrap; font-size: max(.12rem, 9px); font-weight: 700;
  line-height: 1.35; padding: 0 .05rem; letter-spacing: .03em; background: var(--ice); color: var(--ice-900); box-shadow: 0 1px 3px rgba(0, 0, 0, .7); opacity: .92; }
.sitag--board { background: #c2e3ff; }
.sitag--diy { background: var(--mint-500); color: var(--text-on-mint); }
.gm.is-dragging .sitags { display: none; }

/* ---- underframe: the selection diamond of a tapped own piece (ui/underframe.js): 撤退 / 出售 +N / 销毁 ----
   It sits above every HUD panel (detail card z 9, bond popup, drawer, shop bar): only its buttons take pointer events,
   so they are never covered (user playtest #2 item 8); overlays that must win (机变, modals, the drag ghost) are higher. */
.gm__hud > .uframe { position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 12; }
.uframe__dia { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; animation: uframe-in 180ms var(--ease-out); }
@keyframes uframe-in { from { opacity: 0; transform: scale(.85); } }
.uframe__outer { fill: rgba(78, 216, 175, .05); stroke: rgba(255, 255, 255, .88); stroke-width: 1.6px; stroke-dasharray: 7 5; vector-effect: non-scaling-stroke; }
.uframe__corner { fill: none; stroke: var(--mint-400); stroke-width: 2.4px; vector-effect: non-scaling-stroke; }
.uframe__btn {
  position: absolute; pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: .02rem;
  padding: 0; background: none; border: 0; color: #fff; cursor: pointer; filter: drop-shadow(0 .03rem .06rem rgba(0, 0, 0, .8));
  animation: uframe-in 200ms var(--ease-out);
}
.uframe__btn:disabled { opacity: .5; cursor: default; }
.uframe__btn--retreat { left: 25%; top: 25%; transform: translate(-80%, -90%); }
.uframe__btn--sell, .uframe__btn--destroy { left: 75%; top: 25%; transform: translate(-20%, -90%); }
/* the octagon plate every button stands on (the official util_btn plates are octagons) */
.uframe__glyph, .uframe__plate {
  width: .56rem; height: .56rem; padding: .08rem; box-sizing: border-box;
  clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
}

/* ===== public/css/emotes.css （上游原文，逐字节照抄） ===== */
/* Emotes (交流) — public/js/ui/emotes.js. Research 09 §4: picture-only bubbles, a 3×2 pager per theme, 1 s cooldown.
   Sizes follow the official sprites at 1 px = .01rem (1920-wide reference): emoji_btn 151×55, emoji_bkg 313×231,
   emoji_cell_bkg 85×85, emoji_bubble_bkg 108×97. With the local ui/battle extraction the official sprites are used
   (inline --ewheel-* / --ebubble-bg); without it CSS draws look-alikes. Loaded after the screen sheets, so these rules
   also override the v1 emote rules that may still sit in screens/game.css. */

/* ---- picture / fallback glyph ------------------------------------------------------------------------------- */
.eart { display: block; width: 100%; height: 100%; object-fit: contain; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.eart--glyph {
  display: grid; place-items: center; border-radius: 22%;
  background: radial-gradient(circle at 50% 42%, rgba(78, 216, 175, .10), rgba(78, 216, 175, 0) 70%);
  color: rgba(195, 203, 199, .55);
}
.eart--glyph .icon { width: 58%; height: 58%; }
.eart--pending { visibility: hidden; }

/* ---- 交流 button -------------------------------------------------------------------------------------------- */
.ewheel { position: relative; }
.ewheel__btn {
  position: relative; display: flex; align-items: center; justify-content: flex-start; gap: .08rem;
  height: .56rem; min-width: 1.51rem; padding: 0 .2rem 0 .14rem;
  background: rgba(8, 11, 10, .85); border: 1px solid var(--line-2); border-radius: .04rem;
  color: var(--text-md); font-size: .18rem; font-weight: 700; letter-spacing: .1em; line-height: 1;
  transition: color var(--t-fast), border-color var(--t-fast), filter var(--t-fast), opacity var(--t-fast);
}
.ewheel__btn .icon { width: .3rem; height: .3rem; color: var(--mint-500); }
.ewheel__btn:hover:not(:disabled), .ewheel__btn.is-on { color: var(--mint-400); border-color: var(--mint-700); }
.ewheel__btn:disabled { opacity: .5; cursor: not-allowed; }
/* emoji_btn 151×55: plate x 3–147, y 0–45 (a shadow below); the robot face + '<' chevron span x 22–79. The label gets
   its own box right of the chevron (x ≥ 57 %), so a font clamped up by a browser minimum font size (CJK Chrome: 12 px)
   or a small root can never run into the icon; the button never shrinks below 72 px (96 px on touch screens). */
.ewheel__btn.has-sprite {
  --ewb-w: max(1.51rem, 72px);
  width: var(--ewb-w); height: calc(var(--ewb-w) * 55 / 151); min-width: 0; padding: 0; display: block;
  background: var(--ewheel-btn) left bottom / 100% 100% no-repeat; border: 0; border-radius: 0; color: #f2f2f2;
}
.ewheel__btn.has-sprite .ewheel__label {
  position: absolute; left: 57%; right: 3%; top: 0; height: 82%;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-size: calc(var(--ewb-w) * 18 / 151); letter-spacing: .06em; line-height: 1;
}
.ewheel__btn.has-sprite:hover:not(:disabled), .ewheel__btn.has-sprite.is-on { color: #fff; filter: brightness(1.18); border: 0; }
.ewheel__btn.has-sprite:disabled { opacity: 1; color: rgba(242, 242, 242, .45); }
.ewheel__btn.is-cooling { cursor: default; }
.ewheel__label { white-space: nowrap; }

/* ---- panel: one page per theme ----------------------------------------------------------------------------- */
/* emoji_bkg is 313×231 with a soft shadow margin; its opaque plate spans x 15–297, y 13–212. The cells, the pager
   and the CSS fallback plate all use that geometry. */
.ewheel__panel {
  position: absolute; left: -.15rem; bottom: calc(100% + .02rem); z-index: 5;
  width: 3.13rem; height: 2.31rem; padding: 0; box-sizing: border-box;
  background: none; border: 0; border-radius: 0; box-shadow: none;
  transform-origin: .45rem 100%;
  animation: emo-panel-in 160ms var(--ease-out);
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.ewheel__panel::before { /* CSS look-alike of the emoji_bkg plate */
  content: ''; position: absolute; left: .15rem; top: .13rem; width: 2.82rem; height: 1.99rem; border-radius: .06rem;
  background: rgba(19, 19, 19, .92); box-shadow: 0 .04rem .16rem rgba(0, 0, 0, .5), inset 0 0 0 1px rgba(255, 255, 255, .07);
}
.ewheel__panel.has-sprite { background: var(--ewheel-bg) center / 100% 100% no-repeat; }
.ewheel__panel.has-sprite::before { content: none; }
.ewheel__viewport { position: absolute; left: .205rem; top: .19rem; width: 2.71rem; height: 1.78rem; overflow: hidden; touch-action: pan-y; cursor: grab; }
.ewheel__viewport:active { cursor: grabbing; }
.ewheel__page {
  display: grid; grid-template-columns: repeat(3, .85rem); grid-auto-rows: .85rem; gap: .08rem;
  justify-content: space-between; align-content: start; height: 100%;
  animation: emo-page-in 180ms var(--ease-out);
  will-change: transform;
}
.ewheel__page.is-from-right { animation-name: emo-page-from-right; }
.ewheel__page.is-from-left { animation-name: emo-page-from-left; }
.ewheel__page.is-dragging { animation: none; transition: none; opacity: .92; }

.ewheel__item {
  position: relative; display: grid; place-items: center; width: .85rem; height: .85rem; padding: .07rem; margin: 0; box-sizing: border-box;
  background: rgba(255, 255, 255, .16); border: 0; border-radius: .08rem; color: inherit; font-size: 0; flex-direction: initial; gap: 0;
  transition: background-color var(--t-fast), filter var(--t-fast), transform 90ms var(--ease-out);
}
.ewheel__panel.has-cell .ewheel__item { background: var(--ewheel-cell) center / 100% 100% no-repeat; border-radius: 0; }
.ewheel__item:hover:not(:disabled) { background-color: rgba(255, 255, 255, .26); filter: brightness(1.12); transform: none; border-color: transparent; }
/* the official cell is a rounded plate with transparent corners: brighten it, never fill its square box */
.ewheel__panel.has-cell .ewheel__item:hover:not(:disabled) { background-color: transparent; filter: brightness(1.35); }
.ewheel__item:active:not(:disabled) { transform: scale(.9); }
.ewheel__item:focus-visible { outline: 2px solid var(--mint-500); outline-offset: 1px; }
.ewheel__item:disabled { opacity: .45; cursor: default; }

/* pager: ‹ dots › in the strip under the cells */
.ewheel__dots { position: absolute; left: .15rem; width: 2.82rem; top: 1.99rem; height: .12rem; display: flex; align-items: center; justify-content: center; gap: .1rem; }
.ewheel__dot {
  position: relative; width: .11rem; height: .12rem; padding: 0; border: 0; border-radius: .015rem; background: rgba(255, 255, 255, .28);
  transition: background-color var(--t-fast), transform var(--t-fast);
}
.ewheel__dot:hover { background: rgba(255, 255, 255, .55); }
.ewheel__dot.is-on { background: #fff; transform: scale(1.12); }
.ewheel__dot::before { content: ''; position: absolute; inset: -.05rem -.05rem; } /* bigger hit area */
.ewheel__nav {
  position: absolute; top: 1.94rem; width: .26rem; height: .22rem; display: grid; place-items: center; padding: 0; z-index: 1;
  background: none; border: 0; color: rgba(255, 255, 255, .6); transition: color var(--t-fast), opacity var(--t-fast);
}
.ewheel__nav .icon { width: .18rem; height: .18rem; }
.ewheel__nav.is-prev { left: .7rem; }
.ewheel__nav.is-next { right: .7rem; }
.ewheel__nav:hover:not(:disabled) { color: #fff; }
.ewheel__nav:disabled { opacity: .18; cursor: default; }

/* ---- bubble beside the sender's avatar (picture only) ------------------------------------------------------ */
/* emoji_bubble_bkg is 108×97: plate x 22–97, y 8–85, tail tip at x 9, y ≈ 46 (pointing left, toward the avatar). */
.ebubble {
  --ebubble-ttl: 3000ms;
  --ebubble-age: 0ms; /* set inline for a bubble mounted after its emote arrived: resume the timeline, never restart it */
  position: relative; display: block; box-sizing: border-box; width: 1.08rem; height: .97rem; max-width: none; padding: 0;
  background: none; border: 0; clip-path: none; color: inherit; font-size: 0; white-space: normal; filter: none;
  transform-origin: .09rem 47%;
  animation: emo-bubble-pop 240ms var(--ease-out) calc(0ms - var(--ebubble-age)) both,
    emo-bubble-out 300ms var(--ease-in-out) calc(var(--ebubble-ttl) - 300ms - var(--ebubble-age)) forwards;
  pointer-events: none; z-index: 3;
}
/* CSS look-alike of emoji_bubble_bkg: dark rounded square + tail */
.ebubble::before {
  content: ''; position: absolute; left: .22rem; top: .08rem; width: .76rem; height: .78rem; border-radius: .08rem;
  background: rgba(24, 24, 24, .86); box-shadow: 0 .02rem .08rem rgba(0, 0, 0, .45);
}
.ebubble::after {
  content: ''; position: absolute; left: .09rem; top: calc(47% - .08rem); width: .14rem; height: .16rem;
  background: rgba(24, 24, 24, .86); clip-path: polygon(100% 0, 0 50%, 100% 100%);
}
.ebubble.has-sprite { background: var(--ebubble-bg) center / 100% 100% no-repeat; }
.ebubble.has-sprite::before, .ebubble.has-sprite::after { content: none; }
/* in the team panel the bubble is anchored beside the row (placement: screens/game.css .team__bubble) */
.ebubble.team__bubble { position: absolute; }
.ebubble__icon { position: absolute; left: .26rem; top: .12rem; width: .68rem; height: .70rem; display: grid; place-items: center; }
.ebubble .eart { width: 100%; height: 100%; }

@keyframes emo-panel-in { from { opacity: 0; transform: translateY(.06rem) scale(.96); } }
@keyframes emo-page-in { from { opacity: 0; } }
@keyframes emo-page-from-right { from { opacity: .2; transform: translateX(45%); } }
@keyframes emo-page-from-left { from { opacity: .2; transform: translateX(-45%); } }
@keyframes emo-bubble-pop { 0% { opacity: 0; scale: .35; } 60% { opacity: 1; scale: 1.1; } 100% { opacity: 1; scale: 1; } }
@keyframes emo-bubble-out { to { opacity: 0; scale: .92; } }

@media (pointer: coarse) {
  .ewheel__btn.has-sprite { --ewb-w: max(1.51rem, 96px); }
}

@media (prefers-reduced-motion: reduce) {
  .ewheel__panel, .ewheel__page, .ewheel__page.is-from-right, .ewheel__page.is-from-left { animation: none; }
  .ebubble { animation: emo-bubble-out 1ms linear calc(var(--ebubble-ttl) - 1ms - var(--ebubble-age)) forwards; }
}

/* ===== public/css/devices.css （上游原文，逐字节照抄） ===== */
/* ==========================================================================================
   devices.css — multi-device layer (loaded last). Desktop Chrome / Edge / Firefox / Safari, iPad and Android tablets
   in landscape, phones in landscape (≥ 640×360 CSS px). js/ui/device.js puts the feature classes on <html>
   (sp-touch, sp-coarse, sp-hover / sp-no-hover, sp-fs, sp-standalone, sp-reduced-motion) — never UA sniffing.

   1. no page zoom / scroll / pull-to-refresh while playing (touch-action, overscroll-behavior, callouts)
   2. safe-area insets (notches, rounded corners, home indicator): the HUD and every screen stay inside them while the
      board and the backdrops stay full-bleed
   3. touch: every small control gets an invisible ≥ 44 px hit area (::before, no layout change); on short touch
      screens (phones) the most used controls also grow visually
   4. reduced motion extras; fullscreen button
   ========================================================================================== */

:root {
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --tap-min: 44px;
}

/* ---- 1. gestures ------------------------------------------------------------------------------------------------- */
html, body { overscroll-behavior: none; }
/* pan only: no pinch-zoom / double-tap zoom anywhere (scrollable lists still scroll); the field canvas uses none */
html { touch-action: pan-x pan-y; }
body { -webkit-touch-callout: none; }
button, a, label, summary, [role="button"], [role="tab"], [role="option"], .scard, .lvcard, .dband, .bond, .pavatar { touch-action: manipulation; }
img { -webkit-user-drag: none; }
.gm__field, .gm__field canvas, .ff, .fwheel, .fwheel__dia { touch-action: none; }
/* the DOM fallback board drags with pointer events too */
.ff-piece, .ff-slot, .ff-tile { touch-action: none; -webkit-user-select: none; user-select: none; }
input, textarea, select { -webkit-user-select: text; user-select: text; }

/* ---- 2. safe areas ------------------------------------------------------------------------------------------------ */
/* the in-match HUD layer sits inside the safe area; the field (canvas) below it stays full-bleed */
.gm__hud { top: var(--sa-t); right: var(--sa-r); bottom: var(--sa-b); left: var(--sa-l); }
/* the selected unit's underframe (ui/underframe.js) is placed at the tile's CLIENT px (view.tileScreen) inside the HUD
   layer: step back over the HUD's safe-area offset so it stays on its unit on a notched phone */
.gm__hud > .uframe { margin-left: calc(-1 * var(--sa-l)); margin-top: calc(-1 * var(--sa-t)); }
/* the shop bar keeps its place at the bottom edge (it may reach into the home-indicator strip): raised by the bottom
   inset it covered ~3/4 of the bench pads 2–9 on a notched phone (user playtest #4 item 1), and a bench piece is
   pressed / dropped on by its tile. The prep camera keeps the bench clear of the bar (ui/fieldHost.js hudBands →
   render/projection.js clearHud, user playtest #5 item 9). Its right edge stays inside the inset (the notch / rounded
   corner). */
.gm__hud > .shopbar { bottom: calc(.2rem - var(--sa-b)); }
.gm > .spov { left: calc(2.8rem + var(--sa-l)); right: var(--sa-r); }
/* every other screen is laid out inside the safe area (the app backdrop fills the notch strip) */
.screen:not(.gm) { top: var(--sa-t); right: var(--sa-r); bottom: var(--sa-b); left: var(--sa-l); }
.guide, .awayov { padding: var(--sa-t) var(--sa-r) var(--sa-b) var(--sa-l); }
/* (in a match the toasts sit under the top bar: components.css .sp-in-match .toast-host already adds --sa-t) */
html:not(.sp-in-match) .toast-host { margin-top: var(--sa-t); }
.conn-banner { margin-bottom: var(--sa-b); }
.rotate-hint { padding: calc(24px + var(--sa-t)) calc(24px + var(--sa-r)) calc(24px + var(--sa-b)) calc(24px + var(--sa-l)); }

/* ---- 3. touch targets ---------------------------------------------------------------------------------------------- */
/* An invisible hit area of at least --tap-min around small controls on touch screens: centred, never smaller than the
   control, no layout change. Only controls that do not use ::before themselves are listed. */

.sp-sv__top--left{flex:0 1 auto}

/* 下拉栏：借 .lo-select 的观感。
   · flex:1 1 auto ⇒ 皮肤下拉**吃掉**余量（不写 grow 的话它只按内容宽，顶栏右侧会空一大块）；
   · min-width 用 calc 把「内边距 + 图标 + 间隙 + select 下限」算出来，正好等于它的 min-content；
   ⚠ 本文件整体是 JS 模板字符串 ⇒ 注释里**不能出现反引号**，否则模板提前结束、整个 Mod 静默不装。 */
.sp-sv__sel{display:inline-flex;flex:1 1 auto;align-items:center;gap:max(.04rem,4px);height:max(.36rem,28px);
  min-width:calc(max(.06rem,5px) + max(.16rem,13px) + max(.04rem,4px) + max(.3rem,26px));
  padding-left:max(.06rem,5px);border:1px solid var(--line);background:rgba(0,0,0,.35)}
.sp-sv__sel:focus-within{border-color:var(--mint-700)}
.sp-sv__sel .sp-sv__svg{flex:0 0 auto;width:max(.16rem,13px);height:max(.16rem,13px);color:var(--mint-500)}
.sp-sv__sel select{flex:1 1 auto;height:100%;min-width:0;max-width:100%;width:auto;
  padding:0 max(.24rem,22px) 0 max(.06rem,5px);border:0;outline:none;cursor:pointer;
  font:inherit;font-size:max(.15rem,11px);color:var(--text-hi);text-overflow:ellipsis;
  background:transparent url("${CARET}") no-repeat right .04rem center / .2rem .2rem;
  -webkit-appearance:none;appearance:none}
.sp-sv__sel select option,.sp-sv__sel select optgroup{background:var(--bg-2);color:var(--text-hi)}
/* 顶栏里的语音下拉是单字标签（中 / 日 / 关）⇒ **不参与伸缩**（flex:0 0 auto），
   宽度就是内容宽（~58px），把余量全部让给皮肤下拉；下限同样用 calc 写死。 */
.sp-sv__sel--mini{flex:0 0 auto;
  min-width:calc(max(.06rem,5px) + max(.16rem,13px) + max(.04rem,4px) + max(.26rem,22px))}
.sp-sv__sel--mini select{min-width:max(.26rem,22px);max-width:max(.9rem,46px);padding-right:max(.2rem,18px)}
/* gear 档把下拉藏掉（档位由 index.js 的 TIER_BY_BUDGET 实测决定）。
   ★ 档位的**唯一来源**在 JS 里，CSS 只按 data 属性执行，不再抄一遍断点 ——
     否则两边迟早不一致（"看着像只放了齿轮，宽度却按三件算"）。 */
.sp-sv__top[data-sp-sv-tier="gear"] .sp-sv__sel{display:none}

/* ---- 仅图标档（icon；窄屏 / 手机横屏） ---------------------------------------------------------
   ★★ 用户口径（2026-10-08）：「手机网页端未出现皮肤/语言切换按键，但 mod 设置按键正常出现。
     手机网页端画面紧张不好显示的话**可以仅显示图标，点击时在图标左下展开列表**」。
   ★ 0.18.0：只剩 icon 一档 —— 右簇时代的 mini 随右簇口径一起退场（22px 图标本身就是
     「看得见、点得到」的完整入口：点击展开同一个皮肤列表浮层，所以不再算降级）。
   ★ 尺寸口径：宽 max(.22rem,22px) 就是 LEFT_TIER_BY_BUDGET 里 need.icon 的来源，
     改这里必须回头改 index.js 的 LEFT_TIER_BY_BUDGET（那边用同一组数字）。 */
.sp-sv__icons{display:flex;align-items:center;gap:max(.04rem,4px);min-width:0}
.sp-sv__iconwrap{position:relative;display:inline-flex;flex:0 0 auto}
.sp-sv__iconbtn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;
  width:max(.22rem,22px);height:max(.36rem,28px);padding:0;
  border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--mint-500)}
.sp-sv__iconbtn:hover{border-color:var(--mint-800);color:var(--mint-400)}
.sp-sv__iconbtn[aria-expanded="true"]{border-color:var(--mint-700);background:rgba(0,0,0,.62);color:var(--mint-400)}
.sp-sv__iconbtn .sp-sv__svg{width:max(.16rem,13px);height:max(.16rem,13px)}
/* ★★ 0.18.0：micro 档（最后一档，只在 375px 竖屏这种"宿主左列只剩几十像素"时出现）。
   宿主左列 = max-content + 官方「返回」，实测 375px 视口只剩 37px；一个 14px 的图标还能塞进去，
   22px 就塞不下了（会被压成 0）。所以它是"宁可小一点也要留一个入口"的兜底 ——
   ★ 尺寸口径与 index.js 的 LEFT_TIER_BY_BUDGET 的 micro 项**必须一致**（14px）。 */
.sp-sv__icons--micro .sp-sv__iconbtn--micro{width:max(.14rem,14px);height:max(.24rem,20px);border-color:var(--line-2)}
.sp-sv__icons--micro .sp-sv__iconbtn--micro .sp-sv__svg{width:max(.12rem,11px);height:max(.12rem,11px)}
/* 浮层：贴在图标**下方**。
   ★ 默认（align='right'，右簇时代）= 右对齐 ⇒ 向左 + 向下展开（= 用户说的"图标左下"）。
     右对齐是关键：右簇就在屏幕右缘，若改成 left:0 会**整块伸出屏幕外**点不到。
   ★★ 0.18.0：入口搬到顶栏**左簇**之后方向必须反过来 —— 左簇贴着屏幕**左**缘，
     继续右对齐（right:0）会让整块伸到屏幕外 ⇒ .sp-sv__iconwrap--left .sp-sv__pop{left:0;right:auto}
     （向右展开，最大宽度由 max-width:min(74vw,…) 兜住，不会横向溢出视口）。
   ★ z-index:30 —— .lo-top 是 .lo 的 static 流子项、自身不建层叠上下文，所以这个值直接与
     .lo-body（z-index:auto）比大小 ⇒ 浮层画在列表之上；不写就会被后出现的 .lo-body 盖住。 */
.sp-sv__pop{position:absolute;top:calc(100% + max(.05rem,4px));right:0;z-index:30;
  display:flex;flex-direction:column;overflow-y:auto;padding:max(.03rem,2px);
  min-width:max(2.6rem,150px);max-width:min(74vw,5.4rem);max-height:min(58vh,4.2rem);
  border:1px solid var(--line-2);background:var(--bg-2);box-shadow:0 8px 22px rgba(0,0,0,.5)}
.sp-sv__iconwrap--left .sp-sv__pop{left:0;right:auto}
.sp-sv__pophead{padding:max(.06rem,5px) max(.08rem,6px);font-size:max(.12rem,10px);letter-spacing:.06em;
  color:var(--text-dim);border-bottom:1px solid var(--line)}
.sp-sv__popsep{flex:0 0 auto;height:1px;margin:max(.04rem,3px) 0;background:var(--line)}
/* 列表行：整行可点（触屏目标 ≥ 28px 高）。左侧小方块只做"当前项"指示，不用 :has()。 */
.sp-sv__item{display:flex;align-items:center;gap:max(.06rem,5px);width:100%;text-align:left;cursor:pointer;
  padding:max(.09rem,8px) max(.1rem,8px);border:0;background:transparent;font:inherit;
  font-size:max(.15rem,12px);color:var(--text-md)}
.sp-sv__item::before{content:'';flex:0 0 auto;width:max(.08rem,6px);height:max(.08rem,6px);
  border:1px solid var(--line-3);background:transparent}
.sp-sv__item:hover{background:rgba(255,255,255,.06);color:var(--text-hi)}
.sp-sv__item.is-on{color:var(--mint-400)}
.sp-sv__item.is-on::before{background:var(--mint-500);border-color:var(--mint-400)}

/* 齿轮：观感 = 游戏内设置按钮（btn secondary/sm）；不许被压缩（否则图标变形）。
   ★ 只有图标、没有「设置」二字：① 用户原始要求就是"仅图标，保证手机网页端不出框"；
     ② 实测「设置」二字要 47~55px，顶栏余量只有 ~2.2rem，留着它等于把一个下拉挤成一条缝。
        说明交给 title / aria-label。 */
.sp-sv__gear{display:inline-flex;align-items:center;flex:0 0 auto}
.sp-sv__gear .sp-sv__svg{width:max(.16rem,13px);height:max(.16rem,13px);color:var(--mint-500)}
/* 拿不到 vendor preact 时的降级提示（不是按钮，只是说明） */
.sp-sv__topwarn{display:inline-flex;align-items:center;gap:max(.06rem,5px);font-size:max(.14rem,10px);color:var(--amber)}
.sp-sv__topwarn .sp-sv__svg{width:max(.18rem,12px);height:max(.18rem,12px)}

/* ---- 「模组设置」里本 Mod 那一栏（section.js） ─────────────────────────────────────────────── */
/* 一个栏位的多行：宿主 .set-list 是 flex+gap，这里给"栏位/分组"一个等价容器
   （栏位是被「模组设置」渲染进 .set-list 的，所以分组之间要自己排距离）。 */
.sp-sv__section{display:flex;flex-direction:column;gap:.2rem}
.sp-sv__group{display:flex;flex-direction:column;gap:.16rem}
/* 分组小标题：中文，不用英文 eyebrow（用户口径：英文副标题一律清掉） */
.sp-sv__groupname{font-size:.13rem;letter-spacing:.14em;color:var(--text-dim);
  padding-bottom:.06rem;border-bottom:1px solid var(--line)}
/* 最底部的素材来源小字（用户口径：单独放在最底部） */
.sp-sv__src{margin:0;font-size:.12rem;line-height:1.7;color:var(--text-dim)}
/* 版本自证行（v0.7.1 新增）：栏位最底部一行 vX.Y.Z，玩家肉眼即可判断浏览器加载的是哪一版。
   ★ 观感：右对齐、比素材来源再暗一档、等宽数字，不抢视线（用户口径：不要多余装饰）。 */
.sp-sv__ver{margin:.02rem 0 0;font-size:max(.11rem,9px);line-height:1.6;color:var(--text-dim);
  opacity:.75;text-align:right;font-variant-numeric:tabular-nums}

/* 信息小圈（每局开始时随机 / 素材上游 / 配置备份）—— 只有这三项有；其余小字一律删掉了。
   ★★ 这一份是「？小圈」的**规范实现 CSS**（规范条文 docs/MODS.md 的 4.12 节）：短标签 + 「?」小圈 +
   纯 CSS 弹出（::after + data-tip，不用原生 title 撑场：触屏没有 hover 也没有显示时机，
   所以 tabindex + :focus 让"点一下"也出）。**换实现 / 抄到别的 Mod 时保持一致**：
     · 圆形 .17rem、1px 描边 var(--line-3)、border-radius:50%、cursor:help；
     · hover / :focus 才高亮，用薄荷色 token（--mint-500 描边 / --mint-400 文字）；
     · 弹出面板贴宿主 .tooltip 的观感：--bg-2 底 + --line-2 描边 + 2px 圆角 + 深阴影，宽 3.1rem、可换行。
   ★ 本文件整体是 JS 模板字符串 —— 注释里不能出现反引号。 */
.sp-sv__info{position:relative;display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;width:.17rem;height:.17rem;margin-left:.07rem;border:1px solid var(--line-3);border-radius:50%;
  color:var(--text-lo);font-size:.115rem;line-height:1;cursor:help;outline:none;
  transition:color .12s var(--ease-out),border-color .12s var(--ease-out)}
.sp-sv__info:hover,.sp-sv__info:focus{border-color:var(--mint-500);color:var(--mint-400)}
.sp-sv__info::after{content:attr(data-tip);position:absolute;left:50%;bottom:165%;transform:translateX(-50%);
  width:3.1rem;padding:.09rem .11rem;border:1px solid var(--line-2);border-radius:2px;background:var(--bg-2);
  color:var(--text-md);font-size:.125rem;line-height:1.6;letter-spacing:.01em;text-align:left;white-space:normal;
  box-shadow:0 4px 14px rgba(0,0,0,.35);opacity:0;visibility:hidden;pointer-events:none;z-index:9;
  transition:opacity .12s var(--ease-out)}
.sp-sv__info:hover::after,.sp-sv__info:focus::after{opacity:1;visibility:visible}

/* ---- 兜底外壳（没装 cyanfish.mod-settings 时用同一份栏位渲染的最小弹窗） ───────────────────── */
.sp-sv__blk{display:flex;flex-direction:column;gap:.16rem}
.sp-sv__setlist{padding-top:.06rem}
/* 导入 / 导出：.set-row 的第 2~4 列 */
.sp-sv__listen{grid-column:2 / 4;justify-self:start;display:flex;flex-wrap:wrap;align-items:center;gap:max(.08rem,6px)}
.sp-sv__file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

/* ---- ★★ 更新②「随机皮肤」那一组（section.js 的 SetRow） ────────────────────────────────────────
   ★ 为什么不去动宿主 CSS：宿主 .set-row 是三列 grid（3.3rem 标签 / 1fr / auto），我们把子项整体
     放进第 2 列 ⇒ 按钮的左边线与本栏其它控件（.set-toggle / .set-seg 都是 grid-column:2/4）对齐。
   ★ 允许换行：官方设置弹窗只有 7.4rem 宽（内嵌进它时内容列约 6.8rem），
     「立即为所有干员随机皮肤」+「撤销」在窄屏上一行放不下 —— 换行，不要裁掉（同 .sp-ms__pane 的态度）。 */
.sp-sv__setrow{align-items:center}
.sp-sv__setctl{grid-column:2 / 4;justify-self:start;display:flex;flex-wrap:wrap;align-items:center;gap:max(.08rem,6px);min-width:0}
.sp-sv__sethint{color:var(--text-dim);font-size:max(.13rem,10px);line-height:1.6;white-space:normal}
/* 这一组底部的口径说明（随机范围）。★ 用 <p> 而不是塞进 .set-row__label：
   宿主的标签是 nowrap，长句会横着溢出去把弹窗撑破。 */
.sp-sv__hint{margin:0;color:var(--text-dim);font-size:max(.13rem,10px);line-height:1.7;white-space:normal}

/* ---- ★ 0.10.0：自选编队（screens/diy.js）**每个槽位**的皮肤选择（client/diy.js） ─────────────────────
   落点 = 宿主每个**已填充**槽位操作区 .diy-slot__acts（宽屏是竖排一列、<=760px 由宿主折成右对齐的一行），
   位置在官方「更换 / 清空」**之后**（宿主决定，我们只管自己这块长什么样）。
   ★ 为什么要写死宽度：宿主 .diy-slot 是三列 grid（auto / minmax(0,1fr) / auto，loadout.css:401），
     操作列宽 = **最宽子项**。控件不加约束的话，长时装名会把正文列挤没（原生 select 的 min-content
     就是它最宽的那个选项）。所以给一个 rem 口径的固定宽 + 与宿主 btn--sm 同高的外形，
     让官方两个按钮那一列的宽度变化尽量小、四个槽位看起来一样宽。
   ★ 外形沿用本 Mod 顶栏那套 .sp-sv__sel（它本身就是照宿主 .lo-select 画的，见 style.js 顶部）。
   ★ 本文件整体是 JS 模板字符串 —— 注释里不能出现反引号。 */
.sp-sv__diy{display:flex;flex-direction:column;gap:max(.03rem,2px);min-width:0;
  width:max(1.4rem,90px);max-width:max(1.4rem,90px)}
.sp-sv__diysel{display:inline-flex;align-items:center;gap:max(.04rem,4px);min-width:0;
  height:max(.32rem,26px);padding-left:max(.06rem,5px);
  border:1px solid var(--line);background:rgba(0,0,0,.35)}
.sp-sv__diysel:focus-within{border-color:var(--mint-700)}
.sp-sv__diysel.is-off{border-style:dashed;opacity:.7}
.sp-sv__diysel .sp-sv__svg{flex:0 0 auto;width:max(.16rem,13px);height:max(.16rem,13px);color:var(--mint-500)}
.sp-sv__diysel.is-off .sp-sv__svg{color:var(--text-lo)}
.sp-sv__diysel select{flex:1 1 auto;height:100%;min-width:0;width:100%;
  padding:0 max(.2rem,18px) 0 max(.05rem,4px);border:0;outline:none;cursor:pointer;
  font:inherit;font-size:max(.13rem,10px);color:var(--text-hi);text-overflow:ellipsis;
  background:transparent url("${CARET}") no-repeat right .04rem center / .18rem .18rem;
  -webkit-appearance:none;appearance:none}
.sp-sv__diysel select option{background:var(--bg-2);color:var(--text-hi)}
.sp-sv__diysel select:disabled{cursor:default;color:var(--text-lo);background-image:none;padding-right:max(.05rem,4px)}
/* 「当前：这套皮肤名」那一行 —— 目标就是"玩家一眼看到这名干员现在配的是哪套"。 */
.sp-sv__diyname{font-size:max(.11rem,8px);line-height:1.5;color:var(--text-lo);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp-sv__diy.is-on .sp-sv__diyname{color:var(--mint-400)}

/* ---- ★★ 0.15.0：该干员**行内那一格** / **详情面板**里的控件 -------------------------------
   两个位置共用同一个组件（controls.js 的 SkinVoiceControls）⇒ 这里也共用一套样式，只有一处尺寸差异
   （详情面板那一条用宿主自己的 .sp-coarse 触屏口径放大，因为详情面板的宽度富余）。
   ★★ 0.17.0：原来的"两个控件"（皮肤 + 单干员语音）此后**只有皮肤一件**（语种轴删净，见 controls.js
      文件头）；因此下面（2）里"两件控件各自的 min-content 必须被尊重"的那条判据如今只剩一件 ——
      宿主 loadout.css 的 minmax(max-content, var(--arow)) **一字未改**（本工序不动宿主 CSS）。
   ★ 顶层类名由宿主 CSS 认：.lo-arow 是条件式第 5 列的唯一开关（loadout.css 那一节），
     它的 display:flex 也由宿主给；这里只负责"控件在这一格里怎么收缩"。
   ★★ 收缩是硬约束：.lo-card 的第 5 轨是 minmax(max-content, 11rem)，原生 select 的
     min-content 等于**最宽那个选项**（时装名可以很长）⇒ 任何一个子项留 min-width:auto 都会把
     整个 .lo-list 顶出横向滚动条。所以下面每一层都显式写 min-width:0 + overflow:hidden。

   ★★（服主反馈 ①）—— **逐值复刻宿主的「潜能 / 练度」那一套**，并**取消两个小图标**：
     (1) 图标没了：.sp-sv__lo .sp-sv__svg 的尺寸/配色规则整条删除，controls.js 也不再渲染图标节点。
         理由：服主口径「该栏显示的下拉框应该取消两个小图标（不在这里做收成小图的展示，宽度不足时有顶部兜底）」。
     (2) rest 态与左侧 .lo .lo-cult .lo-select（loadout.css:245-247）**逐项相同**。我们不是
         .lo-cult 的子节点 ⇒ 那条规则命中不到我们，所以在这里按它的 **6 个属性值逐条抄**：
           · height        : .32rem / 22px   （原来是 max(.32rem,22px)，但少了这一条就落回基类 .4rem/24px）
           · padding-left  : 0               （原来是 max(.05rem,4px)）
           · border-color  : transparent     （原来是 var(--line) ⇒ 看着像"未修改的 UI 样式"）
           · background    : rgba(255,255,255,.03)（原来是 rgba(0,0,0,.35)）
           · select padding: 0 max(.2rem,14px) 0 max(.06rem,4px)（原来是 …16px…3px）
           · select font   : max(.14rem,10px)（原来是 max(.13rem,10px)）
         其余本来就一致：display/align-items/box-sizing/border-width/圆角(0)/箭头图与位置/cursor。
         ★ 判据（真机 computed style 对照表）见 内部工序记录 §①。
     (3) **焦点绿框**：绿框就是这一层 label 的 1px 描边（宿主 .lo-select:focus-within{border-color:var(--mint-700)}
         的同一条口径）。它天然包住**整个** label（含文字前的空白），所以"框比控件小"只会来自
         "控件本身被内层元素撑出了 label"——取消图标 + 各层 min-width:0/overflow:hidden 就是这件事的保证。
         ★★ 顺序是硬约束：:focus-within 那条必须写在**基类之后**（同特异度、后者胜；写反了 hover
         时基类的透明描边会盖掉绿框）。.is-on（玩家明确钉了一档 = 那个视觉语言的"已改"态，
         与官方 .lo-cult .lo-select.is-off 同一套 mint 高亮）因此排在 focus 之前。 */
.sp-sv__controls{min-width:0;max-width:100%}
/* ★★ 这里**故意不写 display** —— 见下面这条实测踩坑记录（写 display:flex 会让窄屏降级彻底失效）：
   本 Mod 的 <style> 是**运行时 append 到 <head> 末尾**的（installStyle），而宿主的 loadout.css 是

ld__grid\"><\/div>\n<div class=\"dja-pixi\" data-pixi=\"op\" style=\"left:4.2rem;top:4.6rem;width:1.1rem;height:2rem\"><span class=\"dja-op\"><\/span><span class=\"dja-pixi__tag\">干员（Spine）<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"hud\" style=\"left:4.2rem;top:4.1rem;width:1.1rem;height:0.5rem\"><span class=\"dja-bar\"><i style=\"width:72%\"><\/i><\/span><span class=\"dja-sp\"><i style=\"width:40%\"><\/i><\/span><span class=\"dja-pixi__tag\">场内血条（单位头顶）<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"enemy\" style=\"left:8.6rem;top:6.2rem;width:1rem;height:1.8rem\"><span class=\"dja-enemy\"><\/span><span class=\"dja-pixi__tag\">敌方<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"token\" style=\"left:6rem;top:7.4rem;width:0.6rem;height:0.9rem\"><span class=\"dja-token\"><\/span><span class=\"dja-pixi__tag\">召唤物<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"device\" style=\"left:11.4rem;top:5.2rem;width:1rem;height:1rem\"><span class=\"dja-device\"><\/span><span class=\"dja-pixi__tag\">装置箱体 / 炮台<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"item\" style=\"left:7.2rem;top:8.4rem;width:0.7rem;height:0.7rem\"><span class=\"dja-item\"><\/span><span class=\"dja-pixi__tag\">装备 / 掉落物<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"num\" style=\"left:5.4rem;top:3rem;width:0.9rem;height:0.45rem\"><span class=\"dja-num\">-428<\/span><span class=\"dja-pixi__tag\">伤害数字<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"fx\" style=\"left:9.8rem;top:3.4rem;width:1.6rem;height:1rem\"><span class=\"dja-fx\"><\/span><span class=\"dja-pixi__tag\">特效（粒子 / 弹道 / 环）<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"range\" style=\"left:3.4rem;top:7rem;width:2.6rem;height:2.6rem\"><span class=\"dja-range\"><\/span><span class=\"dja-pixi__tag\">攻击范围高亮<\/span><\/div>\n<div class=\"dja-pixi\" data-pixi=\"beam\" style=\"left:12.4rem;top:7.6rem;width:1.2rem;height:2.2rem\"><span class=\"dja-beam\"><\/span><span class=\"dja-pixi__tag\">光束（默认不做）<\/span><\/div>\n
